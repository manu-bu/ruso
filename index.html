function renderMesaFijaVerbos(mesa) {
  const grid = document.createElement('div');
  grid.className = 'mesa-fija';

  const datosVerbo = estado.subtema ? VERBOS_DATA[estado.subtema] : null;

  TIEMPOS_BASE.forEach((t, i) => {
    const card = document.createElement('div');
    card.className = 'tarjeta-fija';
    card.style.background = `linear-gradient(#ffffff, #ffffff) padding-box, linear-gradient(135deg, ${t.color1}, ${t.color2}) border-box`;
    card.style.border = `var(--card-border-w) solid transparent`;
    card.style.borderRadius = `var(--card-radius)`;
    card.style.boxShadow = `0 0 2px 0 ${hexToRgba(t.color1, 0.55)}, 0 0 7px 1px ${hexToRgba(t.color1, 0.22)}`;

    if (datosVerbo) {
      const d = datosVerbo.tiempos[i];
      const filasHtml = d.filas.map(fila => {
        const frase = fila.p.endsWith("'") ? `${fila.p}${fila.f}` : `${fila.p} ${fila.f}`;
        return `<tr><td class="persona">${fila.p}</td><td class="hablar" data-hablar="${frase}" style="color:${t.color1}; white-space:nowrap;">${fila.f}</td></tr>`;
      }).join('');
      card.innerHTML = `
        <div class="tarjeta-titulo" style="color: ${t.color1};">${t.titulo}</div>
        <div class="tarjeta-fija-subtitulo">${d.subtitulo}</div>
        <div class="tarjeta-cuerpo">
          <table class="tabla-conjugacion">${filasHtml}</table>
          ${d.nota ? `<div class="tarjeta-fija-nota">${d.nota}</div>` : ''}
        </div>`;
    } else {
      card.innerHTML = `
        <div class="tarjeta-titulo" style="color: ${t.color1};">${t.titulo}</div>
        <div class="tarjeta-cuerpo" style="flex:1; display:flex; align-items:center; justify-content:center; color:#ccc; font-size:15px;">
          contenido
        </div>`;
    }
    grid.appendChild(card);
  });

  mesa.appendChild(grid);

  // Empareja el alto dentro de cada fila (las 4 de arriba entre sí, las 4
  // de abajo entre sí) midiendo el alto real ya pintado — más confiable
  // que depender solo de CSS grid, que puede no recalcular bien cuando
  // el contenido crece (más personas, notas más largas, etc.)
  const tarjetas = Array.from(grid.children);
  tarjetas.forEach(c => c.style.height = 'auto');
  const filaArriba = tarjetas.slice(0, 4);
  const filaAbajo  = tarjetas.slice(4, 8);
  [filaArriba, filaAbajo].forEach(fila => {
    if (fila.length === 0) return;
    const maxAlto = Math.max(...fila.map(c => c.offsetHeight));
    fila.forEach(c => c.style.height = maxAlto + 'px');
  });
}

// Mesa fija de Verbos en ruso (unidad J) — misma mecánica de grilla 4×2
// que la francesa, pero SIN degradé de color (borde gris neutro, plano):
// a la espera de que se defina la paleta cuando se revise el resto de
// la app. Además, para TTS solo se lee la forma rusa (fila.f) — el
// label de la izquierda (masc./fem./tú/ustedes) es una etiqueta
// gramatical, no una palabra rusa, así que no se concatena para hablar.
// Colorea la etiqueta de persona/sujeto con el mismo sistema de colores
// que ya usa el resto de la app para género (masc=celeste, fem=rosa,
// neutro=amarillo, plural=verde) + violeta para "yo/tú" (pueden ser
// masc. o fem. según quién habla, no tienen género fijo propio).
function coloredPersona(p) {
  const violeta = ['я', 'ты', 'tú'];
  const verde = ['мы', 'вы', 'они', 'ustedes', 'plural'];
  const mapaDirecto = { 'masc.': 'masc', 'fem.': 'fem', 'neutro': 'neutro' };
  if (p === 'он/она/оно') {
    return '<span class="g-masc">он</span>/<span class="g-fem">она</span>/<span class="g-neutro">оно</span>';
  }
  if (violeta.includes(p)) return `<span class="g-elidido">${p}</span>`;
  if (verde.includes(p)) return `<span class="g-plural">${p}</span>`;
  if (mapaDirecto[p]) return `<span class="g-${mapaDirecto[p]}">${p}</span>`;
  return p;
}

      <div class="bloque-info-parrafo" style="font-size:16px; padding-left:10px;"><strong style="color:var(--tema-c2);">③ Х = J:</strong> un raspado suave, no tan fuerte/bruto como la jota española.</div>

  wrap.appendChild(card);

}
const ESQUINA = 20; // separación desde el borde de la mesa al aparecer por primera vez

function renderMesaLibre(mesa) {
  const clave = claveNivelActual();
  const disponibles = CONTENIDO_TARJETAS[clave] || [];
  const sacadas = estado.sacadas[clave] || [];

  mesa.innerHTML = '';

  if (sacadas.length === 0) {
    mesa.innerHTML = '<div class="mesa-vacia" style="opacity:0.4">Mesa lista — abrí la caja de tarjetas para sacar contenido</div>';
    return;
  }

  const rectMesa = mesa.getBoundingClientRect();

  sacadas.forEach((id, i) => {
    const def = disponibles.find(t => t.id === id);
    if (!def) return;
    const card = def.render();
    card.style.position = 'absolute';
    card.style.zIndex = 10 + i;

    let pos = estado.tarjetas[id];
    if (!pos) pos = { left: ESQUINA, top: ESQUINA };

    // Se posiciona, se mide y se recorta contra los límites reales de la mesa
    card.style.left = pos.left + 'px';
    card.style.top  = pos.top  + 'px';
    mesa.appendChild(card);

    const rectCard = card.getBoundingClientRect();
    const maxX = Math.max(0, rectMesa.width  - rectCard.width);
    const maxY = Math.max(0, rectMesa.height - rectCard.height);
    const nx = Math.min(Math.max(0, pos.left), maxX);
    const ny = Math.min(Math.max(0, pos.top),  maxY);
    card.style.left = nx + 'px';
    card.style.top  = ny + 'px';

    activarArrastre(card, id);
  });
}

// ── Arrastre de tarjetas ──────────────────────────────────────────────
// Se aplica al título de cada tarjeta en mesa libre
function activarArrastre(tarjeta, id) {
  const titulo = tarjeta.querySelector('.tarjeta-titulo');
  if (!titulo) return;

  titulo.addEventListener('pointerdown', ev => {
    if (!estado.editor) return;
    ev.preventDefault();
    tarjeta.style.zIndex = 50;
    const mesa = document.getElementById('mesa');
    const rectMesa = mesa.getBoundingClientRect();
    const rectCard = tarjeta.getBoundingClientRect();

    const ox = ev.clientX - rectCard.left;
    const oy = ev.clientY - rectCard.top;
    const maxX = rectMesa.width  - rectCard.width;
    const maxY = rectMesa.height - rectCard.height;

    function mover(ev2) {
      const nx = Math.min(Math.max(0, ev2.clientX - rectMesa.left - ox), maxX);
      const ny = Math.min(Math.max(0, ev2.clientY - rectMesa.top  - oy), maxY);
      tarjeta.style.left = nx + 'px';
      tarjeta.style.top  = ny + 'px';
    }
    function soltar() {
      document.removeEventListener('pointermove', mover);
      document.removeEventListener('pointerup', soltar);
      estado.tarjetas[id] = {
        left: parseInt(tarjeta.style.left),
        top:  parseInt(tarjeta.style.top)
      };
    }

    document.addEventListener('pointermove', mover);
    document.addEventListener('pointerup', soltar);
  });
}

// ── Inicialización al cargar ──────────────────────────────────────────
// UNIDADES_OCULTAS: unidades que existen y funcionan igual que siempre
// (datos, render, todo intacto) pero no se muestran en el selector.
// Hoy: 'G' (Verbos en francés) — ya no se usa activamente, pero se deja
// el contenido entero por si hace falta consultarlo más adelante.
const UNIDADES_OCULTAS = ['G'];

function iniciarDropdownUnidades() {
  const drop = document.getElementById('dropUnidad');
  drop.innerHTML = '';
  Object.entries(UNIDADES).forEach(([key, u]) => {
    if (UNIDADES_OCULTAS.includes(key)) return;
    const div = document.createElement('div');
    div.className = 'dropdown-item';
    div.textContent = u.nombre;
    div.onclick = () => elegirUnidad(key, u.nombre, u.tipo);
    drop.appendChild(div);
  });
}

iniciarDropdownUnidades();

// Cargar la primera unidad automáticamente al abrir la app (saltando
// las ocultas, para no arrancar en una unidad que no aparece en el menú)
const primeraKey = Object.keys(UNIDADES).find(k => !UNIDADES_OCULTAS.includes(k));
const primeraUnidad = UNIDADES[primeraKey];
elegirUnidad(primeraKey, primeraUnidad.nombre, primeraUnidad.tipo);

  // Preguntas usa solo "?". Frases usa "..." (tres puntitos). Negación
  // usa una "X". El Tiempo usa un relojito de arena. Números (D1) se
  // queda con la paleta gris de siempre (no tiene tema visual propio)
  // pero cambia la forma a los 4 signos de operaciones: +, −, ×, ÷.
  // Chamonix/Actividades/País usan el mix "campo francés": confeti,
  // hojita, granito y circulito, cada uno con su color fijo (ver
  // CULTURA_FR_TIPOS más arriba).
  function modoActual() {
    if (esTerreno()) return 'terreno';
    if (esFloraFauna()) return 'flora-fauna';
    if (esClima()) return 'clima';
    if (esActividades()) return 'chispitas';
    if (esCulturaPaisajeFr()) return 'cultura-mixta';
    if (esVocabulario()) return 'ficha';
    if (esImperativo()) return 'exclamacion';
    if (esSubjuntivo()) return 'interrobang';
    if (esPreguntas()) return 'pregunta';
    if (esFrases()) return 'puntos-suspensivos';
    if (esNegacion()) return 'equis';
    if (esElTiempo()) return 'reloj-arena';
    if (esNumeros()) return 'operaciones';
    if (esNominativo()) return 'petalo';
    if (esAcusativo()) return 'cuadrado';
    if (esInstrumental()) return 'chispitas';
    if (esPrepositivo()) return 'pluma-sola';
    return 'circulo';
  }

  // Cantidad al triple de la original (era 10) — mismo mecanismo y
  // mismo tipo de partícula por unidad, solo se ve más poblado.
  const CANTIDAD_OBJETIVO = 30;
  const particulas = [];

  function nuevaParticula() {
    const paleta = paletaActual();
    const modo = modoActual();
    const base = {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      modo,
      vida: 0,
      duracion: 220 + Math.random() * 160
    };
    if (modo === 'cultura-mixta') {
      const c = CULTURA_FR_TIPOS[Math.floor(Math.random() * CULTURA_FR_TIPOS.length)];
      base.tipo = c.tipo;
      base.color = c.color;
      base.w = 8 + Math.random() * 6;
      base.h = 5 + Math.random() * 4;
      base.rot = Math.random() * 360;
    } else if (modo === 'terreno') {
      base.tipo = ['aguja', 'media', 'pluma'][Math.floor(Math.random() * 3)];
      base.rot = Math.random() * 360;
    } else if (modo === 'flora-fauna') {
      base.tipo = ['hoja', 'flor', 'huella'][Math.floor(Math.random() * 3)];
      base.rot = Math.random() * 360;
    } else if (modo === 'clima') {
      const c = CLIMA_TIPOS[Math.floor(Math.random() * CLIMA_TIPOS.length)];
      base.tipo = c.tipo;
      base.color = c.color;
      base.rot = Math.random() * 360;
    } else if (modo === 'chispitas') {
      base.color = paleta[Math.floor(Math.random() * paleta.length)];
      base.rot = Math.random() * 360;
      base.radio = 3.5 + Math.random() * 2.5;
    } else if (modo === 'petalo') {
      base.color = paleta[Math.floor(Math.random() * paleta.length)];
      base.rot = Math.random() * 360;
    } else if (modo === 'cuadrado') {
      base.color = paleta[Math.floor(Math.random() * paleta.length)];
      base.rot = Math.random() * 360;
      base.lado = 5 + Math.random() * 3;
    } else if (modo === 'pluma-sola') {
      base.color = paleta[Math.floor(Math.random() * paleta.length)];
      base.rot = Math.random() * 360;
    } else if (modo === 'ficha') {
      base.color = paleta[Math.floor(Math.random() * paleta.length)];
      base.rot = Math.random() * 16 - 8;
    } else if (modo === 'exclamacion') {
      base.color = paleta[Math.floor(Math.random() * paleta.length)];
      base.rot = Math.random() * 24 - 12;
      base.escala = 0.85 + Math.random() * 0.4;
    } else if (modo === 'interrobang') {
      base.color = paleta[Math.floor(Math.random() * paleta.length)];
      base.rot = Math.random() * 20 - 10;
      base.escala = 0.85 + Math.random() * 0.4;
    } else if (modo === 'pregunta') {
      base.color = paleta[Math.floor(Math.random() * paleta.length)];
      base.rot = Math.random() * 20 - 10;
      base.escala = 0.85 + Math.random() * 0.4;
    } else if (modo === 'puntos-suspensivos') {
      base.color = paleta[Math.floor(Math.random() * paleta.length)];
      base.rot = Math.random() * 14 - 7;
      base.escala = 0.85 + Math.random() * 0.4;
    } else if (modo === 'equis') {
      base.color = paleta[Math.floor(Math.random() * paleta.length)];
      base.rot = Math.random() * 30 - 15;
      base.escala = 0.85 + Math.random() * 0.4;
    } else if (modo === 'reloj-arena') {
      base.color = paleta[Math.floor(Math.random() * paleta.length)];
      base.rot = Math.random() * 30 - 15;
      base.escala = 0.85 + Math.random() * 0.4;
    } else if (modo === 'operaciones') {
      base.color = paleta[Math.floor(Math.random() * paleta.length)];
      base.rot = Math.random() * 20 - 10;
      base.escala = 0.85 + Math.random() * 0.4;
      base.signo = ['+', '−', '×', '÷'][Math.floor(Math.random() * 4)];
    } else {
      base.color = paleta[Math.floor(Math.random() * paleta.length)];
      base.radio = 4 + Math.random() * 2.5;
    }
    return base;
  }

  for (let i = 0; i < 12; i++) {
    const p = nuevaParticula();
    p.vida = Math.random() * p.duracion;
    particulas.push(p);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = particulas.length - 1; i >= 0; i--) {
      const p = particulas[i];
      p.vida += 1;
      const t = p.vida / p.duracion;
      if (t >= 1) { particulas.splice(i, 1); continue; }

      const alpha = Math.sin(t * Math.PI);

      if (p.modo === 'cultura-mixta') {
        ctx.save();
        ctx.globalAlpha = alpha * 0.9;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.fillStyle = p.color;
        if (p.tipo === 'confeti') {
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        } else if (p.tipo === 'hoja') {
          ctx.beginPath();
          ctx.ellipse(0, 0, 8, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.5)';
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(-7, 0); ctx.lineTo(7, 0);
          ctx.stroke();
        } else if (p.tipo === 'grano') {
          ctx.beginPath();
          ctx.arc(0, 0, 1.8, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.shadowBlur  = 8;
          ctx.shadowColor = p.color;
          ctx.beginPath();
          ctx.arc(0, 0, 3.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      } else if (p.modo === 'terreno') {
        ctx.save();
        ctx.globalAlpha = alpha * 0.85;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        if (p.tipo === 'aguja') {
          ctx.fillStyle = PINO;
          ctx.beginPath();
          ctx.ellipse(0, 0, 10, 1.6, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.tipo === 'media') {
          ctx.fillStyle = VERDE_BRILLANTE;
          ctx.beginPath();
          ctx.arc(0, 0, 5, 0, Math.PI);
          ctx.fill();
        } else {
          ctx.fillStyle = MARRON_CLARO;
          ctx.beginPath();
          ctx.moveTo(0, -8);
          ctx.quadraticCurveTo(5, -3, 0, 8);
          ctx.quadraticCurveTo(-5, -3, 0, -8);
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.5)';
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(0, -7); ctx.lineTo(0, 7);
          ctx.stroke();
        }
        ctx.restore();
      } else if (p.modo === 'flora-fauna') {
        ctx.save();
        ctx.globalAlpha = alpha * 0.85;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        if (p.tipo === 'hoja') {
          ctx.fillStyle = HOJA;
          ctx.beginPath();
          ctx.ellipse(0, 0, 8, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.5)';
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(-7, 0); ctx.lineTo(7, 0);
          ctx.stroke();
        } else if (p.tipo === 'flor') {
          ctx.fillStyle = FLOR;
          for (let k = 0; k < 5; k++) {
            const a = (k / 5) * Math.PI * 2;
            ctx.beginPath();
            ctx.ellipse(Math.cos(a) * 3.2, Math.sin(a) * 3.2, 2.6, 1.6, a, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = POLEN;
          ctx.beginPath();
          ctx.arc(0, 0, 1.8, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = TIERRA;
          ctx.beginPath();
          ctx.ellipse(0, 3, 3.4, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          [[-3.5, -4], [-1.2, -5.5], [1.2, -5.5], [3.5, -4]].forEach(([dx, dy]) => {
            ctx.beginPath();
            ctx.ellipse(dx, dy, 1.5, 2, 0, 0, Math.PI * 2);
            ctx.fill();
          });
        }
        ctx.restore();
      } else if (p.modo === 'clima') {
        ctx.save();
        ctx.globalAlpha = alpha * 0.85;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        if (p.tipo === 'flor') {
          ctx.fillStyle = p.color;
          for (let k = 0; k < 5; k++) {
            const a = (k / 5) * Math.PI * 2;
            ctx.beginPath();
            ctx.ellipse(Math.cos(a) * 3.2, Math.sin(a) * 3.2, 2.6, 1.6, a, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, 0, 1.6, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.tipo === 'hoja') {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.ellipse(0, 0, 8, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.5)';
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(-7, 0); ctx.lineTo(7, 0);
          ctx.stroke();
        } else {
          const esBlanca = p.color === '#ffffff';
          ctx.shadowBlur  = esBlanca ? 16 : 8;
          ctx.shadowColor = p.color;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(0, 0, esBlanca ? 3.6 : 3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      } else if (p.modo === 'chispitas') {
        ctx.save();
        ctx.globalAlpha = alpha * 0.95;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.shadowBlur  = 9;
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        const r = p.radio;
        ctx.beginPath();
        ctx.moveTo(0, -r); ctx.lineTo(r * 0.28, -r * 0.28); ctx.lineTo(r, 0); ctx.lineTo(r * 0.28, r * 0.28);
        ctx.lineTo(0, r); ctx.lineTo(-r * 0.28, r * 0.28); ctx.lineTo(-r, 0); ctx.lineTo(-r * 0.28, -r * 0.28);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      } else if (p.modo === 'petalo') {
        ctx.save();
        ctx.globalAlpha = alpha * 0.9;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, 6, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      } else if (p.modo === 'cuadrado') {
        ctx.save();
        ctx.globalAlpha = alpha * 0.9;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.fillStyle = p.color;
        const l = p.lado;
        ctx.fillRect(-l / 2, -l / 2, l, l);
        ctx.restore();
      } else if (p.modo === 'pluma-sola') {
        ctx.save();
        ctx.globalAlpha = alpha * 0.9;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(0, -8);
        ctx.quadraticCurveTo(5, -3, 0, 8);
        ctx.quadraticCurveTo(-5, -3, 0, -8);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        ctx.moveTo(0, -7); ctx.lineTo(0, 7);
        ctx.stroke();
        ctx.restore();
      } else if (p.modo === 'ficha') {
        ctx.save();
        ctx.globalAlpha = alpha * 0.9;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        const rr = (x, y, w, h, r) => {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        };
        ctx.fillStyle = '#ffffff';
        rr(-7, -7, 14, 14, 3);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = p.color;
        rr(-7, -7, 14, 14, 3);
        ctx.stroke();
        ctx.fillStyle = p.color;
        ctx.fillRect(-4, -1, 8, 2);
        ctx.restore();
      } else if (p.modo === 'exclamacion') {
        ctx.save();
        ctx.globalAlpha = alpha * 0.9;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.scale(p.escala, p.escala);
        ctx.fillStyle = p.color;
        const rrBarra = (x, y, w, h, r) => {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        };
        rrBarra(-2.2, -12, 4.4, 14, 2.2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 6, 2.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      } else if (p.modo === 'interrobang') {
        ctx.save();
        ctx.globalAlpha = alpha * 0.9;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.scale(p.escala, p.escala);
        ctx.fillStyle = p.color;
        ctx.font = '700 15px Quicksand, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('¡?', 0, 0);
        ctx.restore();
      } else if (p.modo === 'pregunta') {
        ctx.save();
        ctx.globalAlpha = alpha * 0.9;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.scale(p.escala, p.escala);
        ctx.fillStyle = p.color;
        ctx.font = '700 16px Quicksand, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', 0, 0);
        ctx.restore();
      } else if (p.modo === 'puntos-suspensivos') {
        ctx.save();
        ctx.globalAlpha = alpha * 0.9;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.scale(p.escala, p.escala);
        ctx.fillStyle = p.color;
        ctx.font = '700 16px Quicksand, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('...', 0, 0);
        ctx.restore();
      } else if (p.modo === 'equis') {
        ctx.save();
        ctx.globalAlpha = alpha * 0.9;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.scale(p.escala, p.escala);
        ctx.fillStyle = p.color;
        ctx.font = '700 17px Quicksand, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('X', 0, 0);
        ctx.restore();
      } else if (p.modo === 'reloj-arena') {
        ctx.save();
        ctx.globalAlpha = alpha * 0.9;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.scale(p.escala, p.escala);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(-5, -8); ctx.lineTo(5, -8); ctx.lineTo(0, 0);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-5, 8); ctx.lineTo(5, 8); ctx.lineTo(0, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillRect(-5.5, -9, 11, 1.4);
        ctx.fillRect(-5.5, 7.6, 11, 1.4);
        ctx.restore();
      } else if (p.modo === 'operaciones') {
        ctx.save();
        ctx.globalAlpha = alpha * 0.9;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.scale(p.escala, p.escala);
        ctx.fillStyle = p.color;
        ctx.font = '700 17px Quicksand, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.signo, 0, 0);
        ctx.restore();
      } else {
        ctx.save();
        ctx.globalAlpha = alpha * 0.9;
        ctx.shadowBlur  = 20;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radio, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.restore();
      }
    }

    ctx.globalAlpha = 1;
    if (particulas.length < CANTIDAD_OBJETIVO && Math.random() < 0.09) {
      particulas.push(nuevaParticula());
    }

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
})();
</script>

</body>
